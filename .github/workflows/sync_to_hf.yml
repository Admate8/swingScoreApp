name: Trigger HF Rebuild

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger HF Space rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://Admate8:$HF_TOKEN@huggingface.co/spaces/Admate8/swingScore hf_space
          cd hf_space
          git commit --allow-empty -m "Trigger rebuild"
          git push
