name: Trigger HF Rebuild

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger HF Space rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://Admate8:$HF_TOKEN@huggingface.co/spaces/Admate8/swingScore hf_space
          cd hf_space
          sed -i "s/ARG CACHEBUST=.*/ARG CACHEBUST=$(date +%s)/" Dockerfile
          git add Dockerfile
          git commit -m "Cache bust: $(date +%s)"
          git push
